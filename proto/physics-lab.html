<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype trọng lực — vật lý trần</title>
  <link rel="icon" href="data:,">
  <style>
    body { margin: 16px; background: #15191d; color: #e1e6ea; font: 14px monospace; }
    main { width: var(--canvas-width); max-width: calc(100vw - var(--panel-width) - 32px); }
    canvas { width: 100%; height: auto; }
    pre { white-space: pre-wrap; }
    #journal { max-height: 160px; overflow: auto; }
    button { padding: 8px; margin-right: 8px; }
    .lil-gui { max-height: 100vh; overflow: auto; }
    @media (max-width: 1000px) { main { max-width: 100%; } .lil-gui.root { position: static; } }
  </style>
</head>
<body>
  <main>
    <h1>Prototype vật lý trần</h1>
    <p>Kéo vật bằng chuột. Đổ / lau: chọn công cụ rồi bấm lên bề mặt. Còi chỉ hiện bằng chữ.</p>
    <div id="canvas"></div>
    <p><button id="leave">Ra hành lang</button><button id="enter">Vào phòng</button></p>
    <pre id="status" aria-live="polite"></pre>
    <details open><summary>Nhật ký (không ghi hướng)</summary><pre id="journal"></pre></details>
    <pre id="messages" aria-live="polite"></pre>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
